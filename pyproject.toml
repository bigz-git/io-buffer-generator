[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "io-buffer-generator"
dynamic = ["version"]
description = "Generate Studio 5000 .l5x IO buffer files from Excel workbooks"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
]

[project.scripts]
io-buffer = "io_buffer_generator.io_buffer_tool:main"

[project.gui-scripts]
io-buffer-gui = "io_buffer_generator.gui:main"

[tool.setuptools.dynamic]
version = {attr = "io_buffer_generator.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
io_buffer_generator = ["Quad Plus Brand Logo.png"]
